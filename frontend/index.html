<!-- ================= JOIN MODAL ================= -->

<div class="modal" id="joinModal">

    <div class="modal-box">

        <button class="modal-close" onclick="closeJoin()">
            ×
        </button>

        <div class="section-label">
            JOIN DELTA
        </div>

        <h2>
            Become part of the ecosystem.
        </h2>

        <p>
            Create your Delta account and become part of the community.
        </p>

        <div class="role-options">

            <button type="button" onclick="selectRole('Founder')">
                <span>◉</span>
                Founder
                <small>Build & grow</small>
            </button>

            <button type="button" onclick="selectRole('Consultant')">
                <span>✦</span>
                Consultant
                <small>Guide & solve</small>
            </button>

            <button type="button" onclick="selectRole('Investor')">
                <span>◇</span>
                Investor
                <small>Discover & invest</small>
            </button>

        </div>

        <div id="selectedRole"></div>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Full name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="primary-button"
            >
                Create Account
                <span>→</span>
            </button>

            <div id="registerMessage"></div>

        </form>

    </div>

</div>
